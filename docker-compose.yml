services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8000}
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  mcp-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-client
    depends_on:
      mcp-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8000}
      - MCP_SERVER_URL=http://mcp-server:${PORT:-8000}/sse
    networks:
      - mcp-network
    command: python client.py --interactive
    stdin_open: true
    tty: true

networks:
  mcp-network:
    driver: bridge
