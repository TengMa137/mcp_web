x-mcp-web-image: &mcp-web-image
  image: mcp-web:local
  build:
    context: .
    dockerfile: Dockerfile

x-mcp-web-security: &mcp-web-security
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  cpus: 1.0
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
    - /home/app/.cache:size=512m,mode=700,uid=10001,gid=10001
  shm_size: "512mb"

services:
  mcp-server:
    <<: [*mcp-web-image, *mcp-web-security]
    expose:
      - "${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8000}
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  mcp-network:
    driver: bridge
